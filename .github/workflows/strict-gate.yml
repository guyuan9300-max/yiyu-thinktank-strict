name: strict-gate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: strict-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  strict-gate:
    name: strict-gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "22"
          cache: npm
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.8.3"
          enable-cache: true
      - run: npm ci
      - run: uv sync --frozen --dev
      - name: Verify strict candidate
        run: npm run verify:strict-sync
      - name: Publish exact quarantine inventory
        if: always()
        run: uv run python scripts/report_test_quarantine.py >> "$GITHUB_STEP_SUMMARY"
