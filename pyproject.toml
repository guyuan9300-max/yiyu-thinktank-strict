[project]
name = "yiyu-thinktank-strict-services"
version = "0.29.0"
requires-python = ">=3.11"
dependencies = [
  "cryptography>=44,<47",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "openpyxl>=3.1.5,<4",
  "onnxruntime>=1.24.4,<1.25",
  "passlib>=1.7.4,<2",
  "pydantic>=2.10,<3",
  "pypdf>=5.9,<7",
  "python-docx>=1.1.2,<2",
  "python-multipart>=0.0.20,<1",
  "sharepoint-to-text>=1,<2",
  "sherpa-onnx==1.13.1",
  "soundfile>=0.12,<1",
  "uvicorn>=0.34,<1",
  "yt-dlp>=2026.3.17,<2027",
]

[dependency-groups]
dev = [
  "pyinstaller>=6,<7",
  "pytest>=8,<10",
  "pytest-asyncio>=0.25,<2"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.uv]
package = false
